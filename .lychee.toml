# Skip links inside fenced code blocks. Our spec/plan docs contain large
# verbatim code samples (TOML/YAML/JSON/bash) showing future-file content;
# scanning them as real links produces dozens of spurious failures on every
# push (e.g. plan T0.13's docs/plans/{active,overview,phase-1/plan}.md
# references inside its verbatim Step 1-5 file content).
include_verbatim = false
exclude = [
  "^https://example.com",
  # The repo at github.com/WYI1223/selfKnowledgeBaseWeb is private/not yet
  # public. Spec/plan docs reference its URL (root, .git, settings pages,
  # issues, pulls) for human readers; lychee 404s on all of them.
  "^https://github\\.com/WYI1223/selfKnowledgeBaseWeb(?:\\.git(?:$|/.*)|/.*|$)",
  # docs.astro.build returns intermittent "Connection failed" from GitHub
  # Actions runners (3 consecutive failures observed on D1a + D1b CI runs
  # 2026-05-01; same C1/C2 PR.md URLs fail under the same network
  # conditions other times pass). The URL is canonical Astro docs and is
  # cited in C1/C2 plan PR.md prose; excluding from lychee until either
  # lychee gains a per-host retry option or the runner egress to
  # docs.astro.build stabilizes. This is a transient infrastructure
  # decision, not an endorsement that the URL is broken.
  "^https://docs\\.astro\\.build(/.*|$)",
]
# Per-link retry: lychee currently lacks a per-host retry config; added
# global retries as a defense against transient connectivity noise to
# common hosts (GitHub Actions egress to docs sites is occasionally
# flaky during peak hours).
max_retries = 2
retry_wait_time = 1
exclude_path = [
  "node_modules",
  "dist",
  ".turbo",
  "content/**/_assets",
  "tmp",
  ".codex-runs",
  ".agents",
]
# Note: CLAUDE.md links to docs/plans/active.md, which is created in T0.13
# (the next commit in Phase 0). T0.12 + T0.13 land on `main` locally before
# any remote push, so by the time CI runs the file exists. If link-check
# fails on a partial push, finishing T0.13 fixes it.
max_concurrency = 16
timeout = 20
require_https = false
