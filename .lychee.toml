# Skip links inside fenced code blocks. Our spec/plan docs contain large
# verbatim code samples (TOML/YAML/JSON/bash) showing future-file content;
# scanning them as real links produces dozens of spurious failures on every
# push (e.g. plan T0.13's docs/plans/{active,overview,phase-1/plan}.md
# references inside its verbatim Step 1-5 file content).
include_verbatim = false
exclude = [
  "^https://example.com",
  # The repo at github.com/WYI1223/selfKnowledgeBaseWeb is private/not yet
  # public. Spec/plan docs reference its URL (root, .git, settings pages,
  # issues, pulls) for human readers; lychee 404s on all of them.
  "^https://github\\.com/WYI1223/selfKnowledgeBaseWeb(?:\\.git(?:$|/.*)|/.*|$)",
]
exclude_path = [
  "node_modules",
  "dist",
  ".turbo",
  "content/**/_assets",
  "tmp",
  ".codex-runs",
  ".agents",
]
# Note: CLAUDE.md links to docs/plans/active.md, which is created in T0.13
# (the next commit in Phase 0). T0.12 + T0.13 land on `main` locally before
# any remote push, so by the time CI runs the file exists. If link-check
# fails on a partial push, finishing T0.13 fixes it.
max_concurrency = 16
timeout = 20
require_https = false
