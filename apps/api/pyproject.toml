[project]
name = "skb-api"
version = "0.0.0"
description = "SelfKnowledgeBaseWeb Edit API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "argon2-cffi>=23.0",
    "python-jose[cryptography]>=3.3",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare HTTP status code literals (200/201/401/404/422) — idiomatic.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
